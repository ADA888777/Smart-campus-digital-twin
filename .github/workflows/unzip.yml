{"name":"unzip","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"unzip":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"extract","run":"set -e; mkdir -p _x; unzip -o smart-campus-digital-twin.zip -d _x; rm -rf _x/__MACOSX; shopt -s dotglob; SRC=_x; N=$(ls -A _x | wc -l); if test $N -eq 1; then D=$(ls -A _x); if test -d _x/$D; then SRC=_x/$D; fi; fi; rm -rf $SRC/.github; ls -A $SRC; cp -r $SRC/* .; rm -rf _x; git config user.name github-actions; git config user.email github-actions@github.com; git add -A; git commit -m extract-project-files; git push"}]}}}
