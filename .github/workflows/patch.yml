{"name":"patch","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"patch":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"patch","run":"set -e\nfor f in server.js lib/store.js lib/engine.js lib/topology.js; do node --check $f; done\npython3 - <<'PYEOF'\np='public/index.html'\ns=open(p,encoding='utf-8').read()\nQ=chr(34)\na='<p>Digital twin of the Packet Tracer topology</p>'\nb='<p>Software model of the Packet Tracer topology - simulated, not connected to Packet Tracer</p>'\nassert a in s\ns=s.replace(a,b)\nc='<div class='+Q+'panel-head'+Q+'><h2>Run a scenario</h2><p>Each run writes an event, an alert and a fault record.</p></div>'\nd='<div class='+Q+'panel-head'+Q+'><h2>Run a scenario</h2><p>Each run changes this digital twin only, then writes an event, an alert and a fault record. Nothing is sent to Packet Tracer.</p></div>'\nassert c in s\ns=s.replace(c,d)\ne='<div class='+Q+'panel-head'+Q+'><h2>Fault analysis</h2></div>'\ng='<div class='+Q+'panel-head'+Q+'><h2>Fault analysis</h2><p>Blast radius computed from the twin topology</p></div>'\nassert e in s\ns=s.replace(e,g)\nm='</main>'\nn='<p style='+Q+'margin:20px 4px 0;font-size:12px;line-height:1.7;opacity:.6'+Q+'>This dashboard is a digital twin: a software model of the Packet Tracer topology, not a live connection to it. Latency, packet loss and availability are simulated values produced by the twin engine from the modelled device state, not measurements read from Packet Tracer or from real hardware. Scenario actions change the state of this twin and its own event, alert and fault records only; no Packet Tracer device is modified.</p>\\n  </main>'\nassert s.count(m)==1\ns=s.replace(m,n,1)\nopen(p,'w',encoding='utf-8').write(s)\nprint('ok')\nPYEOF\ngit config user.name github-actions\ngit config user.email github-actions@github.com\ngit add -A\ngit commit -m clarify-simulated-digital-twin\ngit push"}]}}}
