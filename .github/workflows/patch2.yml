{"name":"patch2","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"patch2":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"patch-readme","run":"set -e\npython3 - <<'PYEOF'\np='README.md'\ns=open(p,encoding='utf-8').read()\nN=chr(10)\nL=[]\nL.append('> توضيح مهم: هذا المشروع توأم رقمي، أي نموذج برمجي للشبكة المرسومة في Packet Tracer.')\nL.append('> الطوبولوجيا وأرقام المنافذ وخطة العنونة منسوخة يدويًا إلى lib/topology.js، ولا يوجد')\nL.append('> أي اتصال مباشر بـPacket Tracer ولا أي قراءة بيانات منه أثناء التشغيل.')\nL.append('>')\nL.append('> قيم Latency وPacket Loss وAvailability كلها simulated metrics يولّدها محرّك التوأم')\nL.append('> من حالة الأجهزة داخل النموذج، وليست قياسات حقيقية من Packet Tracer أو من أجهزة فعلية.')\nL.append('>')\nL.append('> سيناريو الجهاز غير المصرّح به يضع UNKNOWN-01 كجهاز Unauthorized ويطبّق قرار Zero Trust')\nL.append('> بالرفض DENY داخل التوأم فقط، دون أن يفصل أي جهاز في Packet Tracer.')\nL.append('>')\nL.append('> في مسار Detect - Analyze - Decide - Action - Alert تُنفَّذ خطوة Action على التوأم نفسه:')\nL.append('> تتغيّر حالة الأجهزة والروابط في النموذج ويُفتح التنبيه، ولا يتعدّل أي شيء خارج المشروع.')\nL.append('>')\nL.append('> زر Restore يعيد الروابط والأجهزة والتنبيهات وسجلات الأعطال والـautomation والـmetrics')\nL.append('> والجهاز غير المصرّح به إلى الوضع الطبيعي، ولذلك كل سيناريو مستقل عن الذي قبله.')\nnote=N.join(L)\nanchor=N+'---'+N\nassert anchor in s\ns=s.replace(anchor,N+note+N+anchor,1)\nopen(p,'w',encoding='utf-8').write(s)\nprint('ok')\nPYEOF\ngit config user.name github-actions\ngit config user.email github-actions@github.com\ngit add -A\ngit commit -m clarify-readme-simulated-twin\ngit push"}]}}}
